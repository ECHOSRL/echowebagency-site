<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" role="img" aria-labelledby="map-title map-desc"><title id="map-title">Moda Moda: osservare, validare, integrare</title><desc id="map-desc">Sei rami: contesto, osservazione, validazione, regole, evidenze e integrazione. Tre mesi di osservazione precedono la scelta degli strumenti.</desc><rect width="1240" height="690" fill="#f5f2eb"/><path d="M 440 345 C 410.0 345, 410.0 125, 380 125" fill="none" stroke="#abb5ac" stroke-width="2"/><path d="M 440 345 C 410.0 345, 410.0 345, 380 345" fill="none" stroke="#abb5ac" stroke-width="2"/><path d="M 440 345 C 410.0 345, 410.0 565, 380 565" fill="none" stroke="#abb5ac" stroke-width="2"/><path d="M 800 345 C 830.0 345, 830.0 125, 860 125" fill="none" stroke="#abb5ac" stroke-width="2"/><path d="M 800 345 C 830.0 345, 830.0 345, 860 345" fill="none" stroke="#abb5ac" stroke-width="2"/><path d="M 800 345 C 830.0 345, 830.0 565, 860 565" fill="none" stroke="#abb5ac" stroke-width="2"/><rect x="440" y="251" width="360" height="188" rx="24" fill="#173e35"/><text x="620" y="294" text-anchor="middle" fill="#d5e6bb" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">MODA MODA</text><text x="620" y="339" text-anchor="middle" fill="#ffffff" font-family="Georgia,serif" font-size="31">Osservatorio AI</text><text x="620" y="378" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20">Osservare → validare</text><text x="620" y="409" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20">→ integrare</text><a href="#approfondimento" data-branch="contesto" aria-label="Approfondisci: IL CONTESTO"><rect x="40" y="45" width="340" height="165" rx="16" fill="#fffefa" stroke="#d9dcd2"/><text x="62" y="75" fill="#667265" font-family="Arial,sans-serif" font-size="14">01</text><text x="62" y="106" fill="#173e35" font-family="Arial,sans-serif" font-size="18" font-weight="bold">IL CONTESTO</text><text x="62" y="139" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Brand di moda fittizio</text><text x="62" y="165" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Due persone nel customer care</text><text x="62" y="191" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Email · form · telefonate</text></a><a href="#approfondimento" data-branch="osservazione" aria-label="Approfondisci: OSSERVARE PER TRE MESI"><rect x="40" y="265" width="340" height="165" rx="16" fill="#fffefa" stroke="#d9dcd2"/><text x="62" y="295" fill="#667265" font-family="Arial,sans-serif" font-size="14">02</text><text x="62" y="326" fill="#173e35" font-family="Arial,sans-serif" font-size="18" font-weight="bold">OSSERVARE PER TRE MESI</text><text x="62" y="359" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Domande, risposte ed esiti</text><text x="62" y="385" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Conversazioni collegate per pratica</text><text x="62" y="411" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Nessuna risposta automatica</text></a><a href="#approfondimento" data-branch="validazione" aria-label="Approfondisci: VALIDARE SUL CAMPO"><rect x="40" y="485" width="340" height="165" rx="16" fill="#fffefa" stroke="#d9dcd2"/><text x="62" y="515" fill="#667265" font-family="Arial,sans-serif" font-size="14">03</text><text x="62" y="546" fill="#173e35" font-family="Arial,sans-serif" font-size="18" font-weight="bold">VALIDARE SUL CAMPO</text><text x="62" y="579" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Raccolto → ripulito → validato</text><text x="62" y="605" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Revisione con le operatrici</text><text x="62" y="631" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Errori ed eccezioni separati</text></a><a href="#approfondimento" data-branch="governance" aria-label="Approfondisci: DEFINIRE LE REGOLE"><rect x="860" y="45" width="340" height="165" rx="16" fill="#fffefa" stroke="#d9dcd2"/><text x="882" y="75" fill="#667265" font-family="Arial,sans-serif" font-size="14">04</text><text x="882" y="106" fill="#173e35" font-family="Arial,sans-serif" font-size="18" font-weight="bold">DEFINIRE LE REGOLE</text><text x="882" y="139" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Finalità, accessi e conservazione</text><text x="882" y="165" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Tutela di clienti e dipendenti</text><text x="882" y="191" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Telefonate: verifica preliminare</text></a><a href="#approfondimento" data-branch="evidenze" aria-label="Approfondisci: LEGGERE LE EVIDENZE"><rect x="860" y="265" width="340" height="165" rx="16" fill="#fffefa" stroke="#d9dcd2"/><text x="882" y="295" fill="#667265" font-family="Arial,sans-serif" font-size="14">05</text><text x="882" y="326" fill="#173e35" font-family="Arial,sans-serif" font-size="18" font-weight="bold">LEGGERE LE EVIDENZE</text><text x="882" y="359" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Motivi di contatto e ricorrenze</text><text x="882" y="385" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Passaggi, attese e informazioni</text><text x="882" y="411" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Base di conoscenza approvata</text></a><a href="#approfondimento" data-branch="integrazione" aria-label="Approfondisci: SCEGLIERE IL SERVIZIO"><rect x="860" y="485" width="340" height="165" rx="16" fill="#fffefa" stroke="#d9dcd2"/><text x="882" y="515" fill="#667265" font-family="Arial,sans-serif" font-size="14">06</text><text x="882" y="546" fill="#173e35" font-family="Arial,sans-serif" font-size="18" font-weight="bold">SCEGLIERE IL SERVIZIO</text><text x="882" y="579" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Esperienza cliente desiderata</text><text x="882" y="605" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Strumenti proporzionati ai bisogni</text><text x="882" y="631" fill="#343d36" font-family="Arial,sans-serif" font-size="17">Automazione modulare e misurata</text></a></svg>